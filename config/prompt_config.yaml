# Prompt Configuration for Japanese Grammar Correction Multi-Task Training
# This file controls prompt templates for GEC and AutoJQE datasets

# Default prompt language settings
default_prompt_language: "japanese"  # Options: "japanese", "english"

# Model-specific prompt settings
model_prompt_settings:
  "0.6B": "english"    # Smaller models work better with English prompts
  "1.5B": "english"    # Based on testing results, English works better
  "1.7B": "english"    # Based on testing results, English works better


# Training Objectives and Corresponding Prompts
training_objectives:
  english:
    # === GEC Dataset Tasks ===
    gec_error_detection:
      description: "Detect and mark grammatical errors in Japanese sentences with high precision"
      system_prompt: ""
      user_template: "Mark grammatical errors with <> brackets around incorrect parts: {input_text}"
      expected_output: "Original sentence with errors precisely marked using <> brackets"
      
    gec_error_correction:
      description: "Correct grammatical errors marked in Japanese sentences"
      system_prompt: ""
      user_template: "Fix the errors marked with <> brackets and provide corrected sentence: {input_text}"
      expected_output: "Clean, grammatically correct Japanese sentence"
      
    gec_end_to_end:
      description: "Direct grammar correction without error marking"
      system_prompt: ""
      user_template: "Correct grammatical errors in this Japanese sentence: {input_text}"
      expected_output: "Grammatically correct and natural Japanese sentence"
      
    # === AutoJQE Dataset Tasks ===
    quality_assessment:
      description: "Assess the quality of grammar corrections"
      system_prompt: ""
      user_template: "Rate this correction quality (1-4):\nOriginal: {source_text}\nCorrected: {corrected_text}"
      expected_output: "Quality score (1-4) with brief explanation"

  japanese:
    # === GEC Dataset Tasks ===
    gec_error_detection:
      description: "日本語文の文法エラーを高精度で検出・マーク"
      system_prompt: ""
      user_template: "エラーをマーク: {input_text}"
      expected_output: "文法エラーが<>括弧で正確にマークされた元の文"
      
    gec_error_correction:
      description: "マークされた文法エラーを修正"
      system_prompt: ""
      user_template: "<>括弧でマークされたエラーを修正して正しい文を提供してください：{input_text}"
      expected_output: "文法的に正しく自然な日本語文"
      
    gec_end_to_end:
      description: "エラーマークなしの直接文法修正"
      system_prompt: ""
      user_template: "この日本語文の文法エラーを修正してください：{input_text}"
      expected_output: "文法的に正しく自然な日本語文"
      
    # === AutoJQE Dataset Tasks ===
    quality_assessment:
      description: "文法修正の品質評価"
      system_prompt: ""
      user_template: "この修正の品質を評価してください（1-4）：\n元の文：{source_text}\n修正文：{corrected_text}"
      expected_output: "品質スコア（1-4）と簡潔な説明"
    



# Multi-task Training Configuration
multi_task_config:
  # Task groupings for joint training
  task_groups:
    gec_core:
      - gec_error_detection
      - gec_error_correction
      - gec_end_to_end
    
    quality_assessment:
      - quality_assessment



# Legacy prompt templates (for backward compatibility)
custom_prompts:
  system_japanese: "あなたは日本語の文法修正を専門とするAIアシスタントです。与えられた文章の文法エラーを正確に修正してください。"
  system_english: "You are a Japanese grammar correction assistant. Correct grammatical errors in Japanese sentences."
  user_japanese: "次の日本語文を文法的に正しく修正してください：{input_text}"
  user_english: "Please correct the grammar in the following Japanese sentence: {input_text}"